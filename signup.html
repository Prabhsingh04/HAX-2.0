  <script>
    /* Leaves a one-shot marker for the landing page: if the next thing the
       visitor sees is the hero, its typing intro is skipped.

       The landing page also checks document.referrer, but the referrer is
       empty on a BACK navigation — the history entry keeps the referrer it
       was first loaded with, not the page you just came from. That is the
       case this marker covers, and it is the common one: most people leave
       an auth screen with the back button. */
    try { sessionStorage.setItem('nx-from-auth', '1'); } catch (e) {}
  </script>

  <!-- Form-level, and only ever for a form-level fault. It rides at the
       top of the window rather than inside the card because it belongs
       to the ATTEMPT, not to any field — putting it between the fields
       would push the form down and read as a problem with whatever it
       happened to land above.

       `role="alert"` announces it on arrival without moving focus away
       from what the reader is editing. -->
  <p class="auth-alert" id="auth-alert" role="alert" aria-live="polite" hidden>
    <span class="auth-alert__dot" aria-hidden="true"></span>
    <span data-alert-text>Email already in use. Sign in instead.</span>
  </p>

  <main class="auth-main">
    <div class="auth-card">

      <h1 class="auth-title">Start building better <em>agentic</em> experiences with HAX.</h1>
      <p class="auth-sub">Create your account.</p>

      <!-- Name, email, password, then the primary action — the same
           order and the same components as sign-in, with the one field
           that separates the flows: signing in identifies someone who
           already exists, signing up creates them, and a new record
           needs a name to address them by.

           The third-party route sits BELOW the rule, as it does on
           sign-in: the form is the path most people take, and putting
           the alternative first makes them read past it every time. -->
      <form class="auth-fields" data-auth="signup" action="#signup" method="post" novalidate>
        <div>
          <label class="auth-label" for="signup-name">Name</label>
          <span class="auth-input-shell">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="8" r="3.6" stroke="currentColor" stroke-width="1.7"/>
              <path d="M4.5 20c0-3.6 3.4-6 7.5-6s7.5 2.4 7.5 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
            <input class="auth-input" id="signup-name" name="name"
                   aria-describedby="signup-name-msg" type="text"
                   autocomplete="name" placeholder="Your name" required />
          </span>
          <p class="auth-msg" id="signup-name-msg" hidden><svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/><path d="M12 7.6v5m0 3.2v.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span></span></p>
        </div>

        <div>
          <label class="auth-label" for="signup-email">Email</label>
          <span class="auth-input-shell">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="2.5" y="4.5" width="19" height="15" rx="3" stroke="currentColor" stroke-width="1.7"/>
              <path d="m3.5 6.5 8.5 6 8.5-6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <input class="auth-input" id="signup-email" name="email"
                   aria-describedby="signup-email-msg" type="email"
                   autocomplete="email" placeholder="you@example.com" required />
          </span>
          <p class="auth-msg" id="signup-email-msg" hidden><svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/><path d="M12 7.6v5m0 3.2v.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span></span></p>
        </div>

        <div>
          <label class="auth-label" for="signup-password">Password</label>
          <span class="auth-input-shell">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="4.5" y="10.5" width="15" height="9.5" rx="2.6" stroke="currentColor" stroke-width="1.7"/>
              <path d="M8.2 10.5V7.8a3.8 3.8 0 0 1 7.6 0v2.7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
            <!-- autocomplete="new-password" is what tells a password manager to
                 OFFER one rather than fill the saved one, and minlength states
                 the rule the placeholder is already claiming. -->
            <input class="auth-input auth-input--reveal" id="signup-password" name="password"
                   type="password" autocomplete="new-password" minlength="8"
                   placeholder="At least 8 characters" required
                   aria-describedby="signup-password-msg" />
            <!-- Masked by default; the control says what it will DO, not
                 what the field currently is. -->
            <button class="auth-reveal" type="button" data-reveal
                    aria-controls="signup-password" aria-pressed="false">Show</button>
          </span>
          <p class="auth-msg" id="signup-password-msg" hidden><svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/><path d="M12 7.6v5m0 3.2v.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span></span></p>
        </div>

        <!-- Live from the start: pressing it always produces an answer,
             either a submission or a note of what is missing. -->
        <button class="auth-btn auth-btn--primary" type="submit" data-submit>
          <span data-submit-label>Create Account</span>
        </button>
      </form>

      <div class="auth-or">OR</div>

      <a class="auth-btn auth-btn--google" href="#google">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.33-1.58-5.04-3.71H.96v2.33A9 9 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.96 10.71a5.4 5.4 0 0 1 0-3.42V4.96H.96a9 9 0 0 0 0 8.08l3-2.33z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.96l3 2.33C4.67 5.16 6.66 3.58 9 3.58z"/>
        </svg>
        Continue with Google
      </a>

      <p class="auth-switch">
        Already have an account? <a href="signin.html">Sign in</a>
      </p>

    </div>
  </main>

  <!-- Page footer, not card content — the same one sign-in carries, so
       moving between the two screens never shifts it. Terms and Privacy
       keep their links but stop standing between the reader and the
       button. -->
  <footer class="auth-footer">
    <a href="index.html">Home</a>
    <a href="#terms">Terms</a>
    <a href="#privacy">Privacy</a>
  </footer>

  <script src="js/auth-form.js"></script>

</body>
